  if (G.busy || G.state !== 'COMBAT' || !G.combat || G.combat.turn !== 'player') return;
  G.busy = true; G.combat.turn = 'enemy'; renderActions();
  log('You give ground and catch your breath.', 'dim');
  setTimeout(beginEnemyTurn, 450);
}

// eat from the pack; in combat it spends your turn, as all honest meals do
function eatFood(id){
  if (G.busy) return;
  const p = G.player, i = p.inv.indexOf(id);
  if (i < 0) return;
  const it = Data.CONSUMABLES[id];
  p.inv.splice(i, 1);
  const before = Math.round(p.food);
  p.food = Math.min(FOOD_MAX, p.food + it.food);
  log(`You eat the ${it.name} (+${Math.round(p.food) - before} FOOD).`, 'good');
  floatOn(true, `+${Math.round(p.food) - before}`, '#a87e34');
  if (it.risky && U.chance(0.3)){
    if (immuneToRot(p)){ log('It fights back on the way down — and loses. Nothing turns your stomach anymore.', 'dim'); }
    else {
      p.statuses.poison = { dmg:3, turns:3 };
      log('It goes down warm — then turns on you. Whatever it was, it disagrees with being eaten.', 'bad');
      discoverCodex('meat_price');
    }
  }
  updateHUD();
  if (G.state === 'COMBAT'){ G.busy=true; G.combat.turn='enemy'; renderActions(); setTimeout(beginEnemyTurn, 500); }
  else renderActions();
}

function flee(){
  if (G.busy || G.combat.boss || G.combat.enemy.guardian) return;
  // slipping away leaves it flat-footed for a couple of steps — enough to actually break away
  const rootIt = () => { const o = G.combat && G.combat.origin; if (o){ o.frozen = 2; o.chase = 0; } };
  if (G.combat.enemy.parts && G.combat.enemy.parts.legs.cut){
    log('It cannot follow on ruined legs. You walk away from it — slowly, to make the point.', 'hi');
    rootIt(); endCombatReturn(); return;
  }
  const p = G.player, en = G.combat.enemy;
  const chance = U.clamp(0.45 + (p.spd - en.spd)*0.03, 0.15, 0.85);
  if (U.chance(chance)){ log('You break away into the dark — it loses a moment finding its feet.', 'hi'); rootIt(); endCombatReturn(); }
  else { log('You fail to escape!', 'bad'); G.busy=true; G.combat.turn='enemy'; renderActions(); setTimeout(beginEnemyTurn, 500); }
}

function beginEnemyTurn(){
  const c = G.combat; if (!c) return;
  // your follower answers before the foe does
  if (followerAlive() && !c.followerActed){
    c.followerActed = true;
    followerAct();
    updateHUD();
    if (c.enemy.hp <= 0){ setTimeout(win, 550); return; }
    setTimeout(beginEnemyTurn, 520);
    return;
  }
  const en = c.enemy, p = G.player;
  startOfTurn(en, false); updateHUD();
  if (en.hp <= 0){ win(); return; }
  if (en.statuses.stun){ delete en.statuses.stun; log(`${en.name} is stunned!`, 'good'); setTimeout(beginPlayerTurn, 550); return; }
  if (en.parts && en.parts.legs.cut && U.chance(0.3)){
    log(`${en.name} drags itself, and its moment passes.`, 'good');
    setTimeout(beginPlayerTurn, 550); return;
  }
  // a boss spends its whole turn tearing your guard down, and says so
  if (en.boss && p.shield > 0 && U.chance(bossShieldBreakChance(p.shield))){
    bossSunder(en, p);
    updateHUD();
    setTimeout(beginPlayerTurn, 700); return;
  }
  const usable = en.moves.filter(m => !m.disabled);
  const move = usable.length ? U.weighted(usable) : { name:'Desperate Flail', type:'attack', power:6 };
  // it may go for the one walking behind you instead — that was the wager
  if (followerAlive() && U.chance(0.3) && enemyTurnsOnFollower(move)){
    updateHUD();
    setTimeout(beginPlayerTurn, 600);
    return;
  }
  resolveAction(en, p, move, false);
  updateHUD();
  if (p.hp <= 0){ lose(); return; }
  setTimeout(beginPlayerTurn, 600);
}

function win(){
  const c = G.combat; if (!c) return;
  const en = c.enemy, p = G.player;
  if (p.vigilTurns > 0){
    p.vigilTurns = 0;
    log('You end it inside the vigil. The light lets go, and leaves you the life you are standing in.', 'gold');
  }
  if (p.classId === 'mage') witchAccretion();   // every victory teaches her something
  const mods = lootMods();
  let gold = U.randInt(en.gold[0], en.gold[1]);
  gold = Math.max(1, Math.round(gold * mods.goldMult * (en.hunter ? 1.4 : 1)));
  p.gold += gold;
  log(`${en.name} falls. +${gold} gold.`, 'gold'); floatOn(false, `+${gold}✦`, '#d0a84e');
  const earnedSouls = gainSouls((en.boss ? 15 : en.guardian ? 10 : en.elite ? 6 : 2) * (en.hunter ? 3 : 1) * mods.soulMult);
  G.floor.removeEntity(c.origin);
  if (en.boss){
    log(`The Gloamlord's death releases ${earnedSouls} Souls.`, 'mag');
    grantItem('gloamheart');
    log('From the collapsing ribcage you take the Gloamheart — still beating, to a slower clock.', 'gold');
    G.combat=null; setTimeout(victory, 700); updateHUD(); return;
  }
  // drops — guardians and elites pay a guaranteed premium; hunters likewise; alignment shifts the rest
  if (en.guardian){
    if (en.dialogue && en.dialogue.defeat) log(`${en.name}: ${en.dialogue.defeat}`, 'mag');
    grantItem(Data.rollItemId(3));
    p.inv.push('potion_heal'); log("The guardian's hoard yields a Draught of Mending.", 'good');
    log(`A legend falls. +${earnedSouls} Souls — and the stair below stands unbarred.`, 'gold');
    // word travels: everything lesser on this floor saw what you did to its keeper
    if (G.floor && !G.floor.guardianSlain){
      G.floor.guardianSlain = true;
      log('The floor knows. What still crawls here has seen what you did to its keeper — it comes at you smaller now.', 'mag');
    }
    // the potion-maker's keeper-herb grows where the guardian fell
    dropGuardianPlant(c.origin.x, c.origin.y, en.name);
    // slaying Omen in the cathedral earns the Necromancer class
    if (en.id === 'omen' && Save.earnAchievement('omen')){
      log('✦ Achievement — Omen is unmade. The Necromancer is now a playable class.', 'mag');
    }
  } else if (en.elite){
    grantItem(en.drop || Data.rollItemId(3));
    p.inv.push('potion_heal'); log('The elite\'s cache holds a Draught of Mending.', 'good');
    log(`${en.name} is slain — a named terror, ended by your hand. +${earnedSouls} Souls.`, 'mag');
    if (en.hunter) p.heat = Math.max(0, (p.heat||0) - 25);   // felling the Captain cows the hunt
  } else if (en.hunter){
    grantItem(Data.rollItemId(U.clamp(Math.ceil(G.depth/2)+1, 1, 3)));
    if (U.chance(0.5)){ p.inv.push('potion_heal'); log('The hunter carried a Draught of Mending.', 'good'); }
    p.heat = Math.max(0, (p.heat||0) - 8);   // thinning the hunt buys a little breathing room
    log('Slaying the Inquisition pays in blood-gold and souls.', 'mag');
  } else {
    const dropChance = U.clamp(0.35 + mods.dropBonus, 0.05, 0.95);
    const tier = U.clamp(Math.ceil(G.depth/2) + mods.tierMod, 1, 3);
    if (U.chance(dropChance)) grantItem(Data.rollItemId(tier));
    else if (U.chance(0.25)){ p.inv.push('potion_heal'); log('It dropped a Draught of Mending.', 'good'); }
  }
  // the practical butchery of survival — beasts are made of meat
  if (en.tags.includes('beast') && U.chance(0.12)){
    p.inv.push('strange_meat');
    log('You carve what travels well. Down here, no one asks what the meat is.', 'dim');
  }
  G.combat = null; G.state = 'EXPLORE'; G.busy = false;
  updateHUD(); renderActions();
}

function endCombatReturn(){ G.combat=null; G.state='EXPLORE'; G.busy=false; updateHUD(); renderActions(); }

function lose(force){
  const p = G.player;
  // Oathwarden — Last Vigil: once a descent, the light refuses to let go. You are
  // left standing on 1 HP with two turns to finish the thing that felled you.
  if (!force && p && p.classId === 'warden' && !p.vigilUsed && G.state === 'COMBAT' && G.combat){
    p.vigilUsed = true; p.vigilTurns = 2; p.hp = 1;
    p.statuses.poison = null; delete p.statuses.poison;
    log('LAST VIGIL — the blow lands, and the light will not let you go.', 'gold');
    log('Two turns to end the thing that felled you. Kill it and you keep the life you are standing in. Fail, and it is over.', 'bad');
    updateHUD(); renderActions();
    return;
  }
  G.busy = true; G.state = 'GAMEOVER';
  clearSavedRun();               // a descent that ended cannot be taken up again
  Save.recordDeath();
  // gold scatters, but Souls cling to you (stable currency survives death)
  const converted = Math.floor((G.player.gold || 0) / 3);
  if (converted > 0) Save.addSouls(converted);
  G.lastConverted = converted;
  log('Darkness takes you. Your bones join the Graveborne.', 'bad');
  if (converted > 0) log(`Your gold scatters — but ${converted} Souls cling to you beyond death.`, 'mag');
  showGameOver();
}
function victory(){
  G.state = 'VICTORY'; clearSavedRun(); Save.recordWin();
  log('The Gloamlord collapses into dust. The depths fall silent.', 'good');
  showVictory();
}

// ================= EVENTS (honor-driven) =================
function triggerEvent(eventId, entity){
  const ev = Data.EVENTS[eventId];
  const variantKey = ev.perceive(G.player.honor);
  const v = ev.variants[variantKey] || ev.variants.clear;
  if (ev.once){ G.player.eventsUsed = G.player.eventsUsed || {}; G.player.eventsUsed[eventId] = true; }
  G.state = 'EVENT';
  G.pendingEvent = { eventId, entity };

  const sheet = U.make('div', 'sheet');
  const art = U.make('canvas'); art.width = 120; art.height = 120; art.className = 'scene-art';
  sheet.appendChild(art);
  Sprites.toCanvas(art, v.art, 9);

  sheet.appendChild(U.make('div', 'sect', ev.name));
  if (variantKey === 'warped')
    sheet.appendChild(U.make('div', 'p dim', '<i>Your dishonor colors what you see…</i>'));
  sheet.appendChild(U.make('div', 'p', v.text));

  const row = U.make('div');
  for (const ch of v.choices){
    const b = Btn(ch.label, () => chooseOutcome(eventId, ch.to, entity), ch.kind === 'danger' ? 'btn danger' : 'btn');
    row.appendChild(b);
  }
  sheet.appendChild(row);
  setModal(sheet);
}

function chooseOutcome(eventId, outId, entity){
  const ev = Data.EVENTS[eventId];
  let out = ev.outcomes[outId];
  let eff = { ...(out.effects||{}) };
  let text = out.text;

  // ----- special: mirror gaze resolves by honor tier -----
  // ----- special: the Nameless god's coin — all things are decided thus -----
  if (out.special === 'coin_flip'){
    if (U.chance(0.5)){
      text = "The coin rings off the black iron, spins — and lands. “HEADS,” says the voice, from inside your own chest. “THE GOD IS AMUSED.” Strength floods you like cold water poured into a cracked jug.";
      eff = { maxhp:6, atk:2, codex:'coin_bless' };
    } else {
      text = "The coin rings off the black iron, spins — and lands. “TAILS,” says the voice, from inside your own chest, and the taking begins. A rib folds inward like wet paper. Something behind your eyes is unthreaded, slowly, with great care. The god does not hurry. The god is never finished being amused.";
      eff = { lethalMaxhp:-10, honor:-4, codex:'coin_curse', reveal:'The coin has no faces. It decides anyway. It has decided men to death.' };
    }
  }

  if (out.special === 'mirror_gaze'){
    const h = G.player.honor;
    if (h >= 20){ text = "The reflection straightens, and light pours from it like dawn through a cracked door. It sets a phantom crown upon your brow. You feel larger than your wounds."; eff = { maxhp:8, heal:99, honor:4, codex:'mir_saint' }; }
    else if (h <= -20){ text = "The reflection grins with too many teeth. It is you, unmasked — and it is not afraid. It reaches through the glass and pours cold power into your hands."; eff = { atk:5, honor:-6, codex:'mir_fiend' }; }
    else { text = "The reflection wavers, half-lit, undecided — as you are. It offers only a moment's clarity before the fog returns."; eff = { sp:99, heal:12, codex:'mir_gray' }; }
  }

  // ----- special: Eliza keeps a stall rather than a conversation -----
  if (out.special === 'eliza_stall'){
    if (entity) G.floor.removeEntity(entity);
    discoverCodex('eliza_stall');
    updateHUD();
    elizaStall();
    return;
  }

  const summary = applyEffects(eff);
  if (entity) G.floor.removeEntity(entity);
  updateHUD();
  showOutcome(ev.name, text, summary, eff.reveal, eff.combat);
}

// Her whole stock: bread, and not much of it. She undercuts the Hollow Merchant
// because she stole all of it and owes nothing to anyone.
function elizaStall(){
  const p = G.player;
  if (!p.elizaStock) p.elizaStock = { ration:2, meat:1 };
  const st = p.elizaStock;
  const breadCost = goldPrice(24 + G.depth*4);
  const meatCost  = goldPrice(30 + G.depth*5);

  const s = U.make('div','sheet');
  const art = U.make('canvas'); art.width=64; art.height=64; art.className='merchant-art';
  s.appendChild(art); Sprites.toCanvas(art, 'npc_eliza', 5);
  s.appendChild(U.make('div','sect','Eliza Sinclair'));
  s.appendChild(U.make('div','p dim center','“Bread and a little else. I said that already.”'));
  s.appendChild(U.make('div','balance',`<span class="g">✦ ${p.gold} Gold</span>`));

  s.appendChild(shopLine(`Grave-Bread${st.ration ? ` ×${st.ration}` : ''}`,
    st.ration ? 'A loaf off the crate (+35 FOOD when eaten)' : 'She is out of bread.',
    `<span class="price g">✦ ${breadCost}</span>`, !st.ration || p.gold < breadCost,
    ()=>{ p.gold -= breadCost; st.ration--; p.inv.push('ration');
      log('Eliza wraps a loaf and takes your coin without counting it.','gold'); updateHUD(); elizaStall(); }));
  s.appendChild(shopLine(`Strange Meat${st.meat ? ` ×${st.meat}` : ''}`,
    st.meat ? 'Still faintly warm (+60 FOOD). She does not say where from.' : 'Gone.',
    `<span class="price g">✦ ${meatCost}</span>`, !st.meat || p.gold < meatCost,
    ()=>{ p.gold -= meatCost; st.meat--; p.inv.push('strange_meat');
      log('“Don\'t ask,” she says, and does not smile this time.','gold'); updateHUD(); elizaStall(); }));

  const row = U.make('div','row');
  // her husband can still stop haggling and ask her to come along
  if (p.classId === 'rogue' && !p.follower && !p.followerFled){
    row.appendChild(Btn('Enough trading — take her hand', ()=>{
      hideModal();
      recruitFollower('eliza');
      discoverCodex('eliza_taken');
      G.state='EXPLORE'; G.busy=false; updateHUD(); renderActions();
    }, 'btn center good'));
  }
  row.appendChild(Btn('Leave her to it', ()=>{ hideModal(); G.state='EXPLORE'; G.busy=false; renderActions(); }, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

function applyEffects(eff){
  const p = G.player, out = [];
  if (eff.honor){ gainHonor(eff.honor); out.push([`${eff.honor>0?'+':''}${eff.honor} Honor`, eff.honor>0?'good':'bad']); }
  if (eff.honorToward != null){ const d = U.clamp(eff.honorToward - p.honor, -5, 5); p.honor += d; out.push([`Honor drifts toward ${eff.honorToward}`, 'mag']); }
  if (eff.gold){ p.gold = Math.max(0, p.gold + eff.gold); out.push([`${eff.gold>0?'+':''}${eff.gold} Gold`, eff.gold>0?'good':'bad']); }
  if (eff.heal){ const before=p.hp; p.hp = eff.heal>=99 ? p.maxhp : Math.min(p.maxhp, p.hp+eff.heal); out.push([`+${p.hp-before} HP`, 'good']); }
  if (eff.sp){ const before=p.sp; p.sp = eff.sp>=99 ? p.maxsp : Math.min(p.maxsp, p.sp+eff.sp); if (p.sp-before) out.push([`+${p.sp-before} SP`, 'good']); }
  if (eff.maxhp){ p.baseHp += eff.maxhp; recomputeStats(p); p.hp = Math.max(1, Math.min(p.maxhp, p.hp + eff.maxhp)); out.push([`${eff.maxhp>0?'+':''}${eff.maxhp} Max HP`, eff.maxhp>0?'good':'bad']); }
  if (eff.lethalMaxhp){ p.baseHp += eff.lethalMaxhp; recomputeStats(p); p.hp = Math.min(p.maxhp, p.hp + eff.lethalMaxhp);
    out.push([`${eff.lethalMaxhp} Max HP`, 'bad']);
    if (p.hp <= 0) out.push(['Your life is forfeit', 'bad']); }
  if (eff.atk){ p.baseAtk += eff.atk; recomputeStats(p); out.push([`+${eff.atk} ATK`, 'good']); }
  if (eff.def){ p.baseDef += eff.def; recomputeStats(p); out.push([`+${eff.def} DEF`, 'good']); }
  if (eff.mag){ p.baseMag += eff.mag; recomputeStats(p); out.push([`+${eff.mag} MAG`, 'good']); }
  if (eff.item){ grantItem(eff.item); out.push([`Received: ${Data.ITEMS[eff.item].name}`, 'gold']); }
  if (eff.potion){ p.inv.push(eff.potion); out.push([`Received: ${Data.CONSUMABLES[eff.potion].name}`, 'gold']); }
  if (eff.potion2){ p.inv.push(eff.potion2, eff.potion2); out.push([`Received: ${Data.CONSUMABLES[eff.potion2].name} ×2`, 'gold']); }
  if (eff.food){ const before = Math.round(p.food); p.food = eff.food >= 99 ? FOOD_MAX : Math.min(FOOD_MAX, p.food + eff.food);
    out.push([`+${Math.round(p.food) - before} FOOD`, 'good']); }
  if (eff.pocketCoin){ p.pocketCoin = true; out.push(['The coin rides in your pocket — flip it when steel fails', 'mag']); }
  if (eff.follower){
    if (p.follower){ out.push(['Someone already walks behind you', 'dim']); }
    else { const fo = recruitFollower(typeof eff.follower === 'string' ? eff.follower : null);
      out.push([`${fo.name} follows you now — their death would damn your name`, 'mag']); }
  }
  if (eff.fovBoost){ G.floorFov = (G.floorFov || 0) + eff.fovBoost; revealFOV(); out.push([`+${eff.fovBoost} sight this floor`, 'good']); }
  if (eff.clearHunters){ const n = G.floor.entities.filter(e=>e.hunter).length; G.floor.entities = G.floor.entities.filter(e=>!e.hunter); if (n) out.push(['The hunters withdraw', 'good']); }
  if (eff.heatDown){ p.heat = Math.max(0, (p.heat||0) - eff.heatDown); out.push(['The hunt cools', 'good']); }
  if (eff.heatUp){ p.heat = Math.min(100, (p.heat||0) + eff.heatUp); out.push(['The hunt intensifies', 'bad']); }
  if (eff.spawnHunter){ spawnHunters(G.floor, 1); out.push(['You are hunted the harder', 'bad']); }
  if (eff.codex){ if (Save.discover(eff.codex)){ const g = gainSouls(4); out.push([`✦ Codex unlocked (+${g} Souls)`, 'mag']); } }
  return out;
}

// ================= RENDERING =================
// The exploration viewport is reshaped to the stage. On a phone the stage is tall
// and portrait while the canvas is a squat landscape strip, so `object-fit:contain`
// used to letterbox a small picture into the middle of a big black box. Matching
// the canvas to the stage's shape — with fewer, bigger tiles — fills it instead.
function fitViewport(){
  if (!canvas || !ctx) return;
  const stage = U.el('stage'); if (!stage) return;
  const cw = stage.clientWidth, ch = stage.clientHeight;
  // combat scenes are composed for the fixed 336x208 frame; desktop already fits
  if (G.state === 'COMBAT' || window.innerWidth > 700 || cw < 40 || ch < 40){
    if (VW !== 21 || VH !== 13){
      VW = 21; VH = 13; canvas.width = 336; canvas.height = 208; ctx.imageSmoothingEnabled = false;
    }
    return;
  }
  // 40px/tile lands the viewport at ~11 wide, so the lit radius (FOV_R) spans the
  // full width — no dark margin left of the torchlight, tiles twice their old size
  const target = 40;                                     // wanted on-screen px per tile
  const vw = U.clamp(Math.round(cw / target) | 1, 9, 25); // odd keeps the player dead centre
  const vh = U.clamp(Math.round(ch / target) | 1, 9, 31);
  if (vw === VW && vh === VH) return;
  VW = vw; VH = vh;
  canvas.width = VW * TS; canvas.height = VH * TS;
  ctx.imageSmoothingEnabled = false;
}

function render(){
  if (!ctx) return;
  updateStageBtn();
  fitViewport();
  if (G.state === 'COMBAT' && G.combat) renderCombat();
  else if (G.player && G.floor) renderExplore();
  else { ctx.fillStyle = '#08070c'; ctx.fillRect(0,0,canvas.width,canvas.height); }
}

// context button on the stage: ☰ opens the menu in exploration, Flee in combat
function updateStageBtn(){
  document.body.classList.toggle('in-combat', G.state === 'COMBAT');
  const b = U.el('stage-btn'); if (!b) return;
  if (G.state === 'EXPLORE' && !G.busy){
    b.classList.remove('hidden','flee'); b.textContent = '☰ Menu';
    b.disabled = false; b.onclick = showMenu;
  } else if (G.state === 'COMBAT' && G.combat){
    const en = G.combat.enemy, canFlee = !G.combat.boss && !en.guardian;
    if (!canFlee){ b.classList.add('hidden'); return; }
    b.classList.remove('hidden'); b.classList.add('flee'); b.textContent = 'Flee';
    b.disabled = G.busy || G.combat.turn !== 'player';
    b.onclick = flee;
  } else {
    b.classList.add('hidden');
  }
}

// crisp enemy readout in the DOM (replaces the blurry canvas-drawn text)
function updateEnemyPanel(){
  document.body.classList.toggle('in-combat', G.state === 'COMBAT');
  const panel = U.el('enemy-panel'); if (!panel) return;
  if (G.state !== 'COMBAT' || !G.combat){ panel.classList.add('hidden'); return; }
  const en = G.combat.enemy;
  panel.classList.remove('hidden');
  const nameEl = U.el('en-name');
  nameEl.textContent = (en.guardian ? '◆ ' : en.elite ? '★ ' : '') + en.name.toUpperCase() + (en.boss ? ' · BOSS' : '');
  nameEl.className = 'en-name' + ((en.elite || en.guardian || en.boss) ? ' elite' : '');
  U.el('en-hpfill').style.width = U.clamp(en.hp / en.maxhp * 100, 0, 100) + '%';
  U.el('en-hptxt').textContent = `${Math.max(0, en.hp)}/${en.maxhp}` + (en.shield > 0 ? `  ⛊${en.shield}` : '');
  const limbs = U.el('en-limbs'); limbs.innerHTML = '';
  if (en.parts){
    for (const key of ['arms','legs','head']){
      const part = en.parts[key];
      const cls = 'en-limb' + (part.cut ? ' cut' : (G.combat.target === key ? ' aim' : ''));
      limbs.appendChild(U.make('span', cls, part.name + ' ' + (part.cut ? '✂' : Math.max(0, part.hp))));
    }
  }
}

function drawTile(t, sx, sy, x, y){
  const pal = curBiome().pal;
  if (t === TILE.WALL){
    // coursed stone: a lit cap on top, a brick face, a shadowed base
    ctx.fillStyle = pal.wallFace; ctx.fillRect(sx, sy, TS, TS);
    ctx.fillStyle = pal.wallTop;  ctx.fillRect(sx, sy, TS, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(sx, sy, TS, 1);       // catch-light on the cap
    // mortar: a horizontal course and staggered vertical joints, so it reads as brick
    ctx.fillStyle = pal.wallDark;
    ctx.fillRect(sx, sy+9, TS, 1);
    const stag = (y % 2) ? 0 : 8;
    ctx.fillRect(sx + 4 + stag, sy+4, 1, 5);
    ctx.fillRect(sx + (stag ? 4 : 12), sy+10, 1, 4);
    // deep base shadow and hard block edges give the wall its thickness
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(sx, sy+TS-2, TS, 2);
    ctx.fillStyle = '#0a0a0f'; ctx.fillRect(sx, sy, 1, TS); ctx.fillRect(sx+TS-1, sy, 1, TS);
  } else if (t === TILE.DOOR){
    // floor underfoot, then a stone frame and a wooden leaf standing ajar
    const alt = (x + y) % 2 === 0;
    ctx.fillStyle = alt ? pal.floorA : pal.floorB; ctx.fillRect(sx, sy, TS, TS);
    ctx.fillStyle = pal.wallTop;  ctx.fillRect(sx, sy, 2, TS); ctx.fillRect(sx+TS-2, sy, 2, TS);   // jambs
    ctx.fillStyle = pal.wallFace; ctx.fillRect(sx+2, sy, TS-4, 3);                                  // lintel
    ctx.fillStyle = '#3a2a18'; ctx.fillRect(sx+3, sy+3, TS-6, TS-4);                                // leaf
    ctx.fillStyle = '#241a10'; ctx.fillRect(sx+7, sy+3, 1, TS-4);                                   // plank seam
    ctx.fillStyle = '#5a4020'; ctx.fillRect(sx+3, sy+7, TS-6, 1);                                   // iron band
    ctx.fillStyle = '#c9a24a'; ctx.fillRect(sx+TS-6, sy+8, 1, 2);                                   // handle
  } else if (t === TILE.HAZARD){
    const hz = curBiome().hazard;
    ctx.fillStyle = pal.floorB; ctx.fillRect(sx, sy, TS, TS);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(sx, sy, TS, 1); ctx.fillRect(sx, sy, 1, TS);
    // pulsing biome-colored scatter so danger reads at a glance
    const pulse = 0.55 + 0.45 * Math.sin(G.time / 320 + x * 7 + y * 13);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = hz.color;
    const s1 = (x*31 + y*17) % 9, s2 = (x*13 + y*29) % 7;
    ctx.fillRect(sx + 3 + s1 % 5, sy + 4 + s2 % 4, 3, 3);
    ctx.fillRect(sx + 9 - (s2 % 3), sy + 9 + (s1 % 3), 2, 2);
    ctx.fillStyle = hz.accent;
    ctx.fillRect(sx + 5 + (s2 % 4), sy + 3 + (s1 % 5), 2, 2);
    ctx.fillRect(sx + 11 - (s1 % 4), sy + 11 - (s2 % 4), 2, 2);
    ctx.globalAlpha = 1;
  } else {
    const alt = (x + y) % 2 === 0;
    ctx.fillStyle = alt ? pal.floorA : pal.floorB; ctx.fillRect(sx, sy, TS, TS);
    ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fillRect(sx, sy, TS, 1); ctx.fillRect(sx, sy, 1, TS);
    // cobble edging where floor meets wall — lines the one-wide corridors and
    // frames the rooms, without needing to know which is which
    const f = G.floor;
    if (f){
      const wN = f.tileAt(x,y-1)===TILE.WALL, wS = f.tileAt(x,y+1)===TILE.WALL,
            wW = f.tileAt(x-1,y)===TILE.WALL, wE = f.tileAt(x+1,y)===TILE.WALL;
      if (wN || wS || wW || wE){
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        if (wN) ctx.fillRect(sx, sy, TS, 2);
        if (wW) ctx.fillRect(sx, sy, 2, TS);
        if (wS) ctx.fillRect(sx, sy+TS-2, TS, 2);
        if (wE) ctx.fillRect(sx+TS-2, sy, 2, TS);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';           // a faint cobble highlight just inside the shadow
        if (wN) ctx.fillRect(sx, sy+2, TS, 1);
        if (wW) ctx.fillRect(sx+2, sy, 1, TS);
        if (wS) ctx.fillRect(sx, sy+TS-3, TS, 1);
        if (wE) ctx.fillRect(sx+TS-3, sy, 1, TS);
      }
    }
    // deterministic detail: biome speckle, and the occasional cracked flagstone
    const seed = (x*928371 + y*1237) % 97;
    if (seed < 7){ ctx.fillStyle = pal.speck; ctx.fillRect(sx + (seed%TS), sy + ((seed*3)%TS), 2, 2); }
    else if (seed > 91){
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx+3, sy+3); ctx.lineTo(sx+7, sy+8); ctx.lineTo(sx+6, sy+13); ctx.stroke();
    }
  }
}

// which room is the ritual sanctum — cached on the floor so the render can give
// its floor a distinct warm tone and an ornamental border
function ensureFloorMeta(f){
  if (f._metaDone) return;
  f._metaDone = true;
  const altar = f.entities.find(e => e.type === 'prop' && e.ritual);
  f._sanctum = altar ? (f.rooms.find(r =>
    altar.x >= r.x && altar.x < r.x + r.w && altar.y >= r.y && altar.y < r.y + r.h) || null) : null;
}
// a double frame with corner keys, echoing the fret borders of a ritual floor
function drawSanctumFret(f, SX, SY){
  const r = f._sanctum; if (!r) return;
  const x0 = SX(r.x) + 3,          y0 = SY(r.y) + 3;
  const x1 = SX(r.x + r.w) - 3,    y1 = SY(r.y + r.h) - 3;
  ctx.strokeStyle = 'rgba(208,168,78,0.20)'; ctx.lineWidth = 1;
  ctx.strokeRect(x0, y0, x1-x0, y1-y0);
  ctx.strokeRect(x0+3, y0+3, x1-x0-6, y1-y0-6);
  // little inward keys at the corners
  for (const [cx,cy,dx,dy] of [[x0,y0,1,1],[x1,y0,-1,1],[x0,y1,1,-1],[x1,y1,-1,-1]]){
    ctx.beginPath();
    ctx.moveTo(cx+dx*7, cy+dy*3); ctx.lineTo(cx+dx*7, cy+dy*7); ctx.lineTo(cx+dx*3, cy+dy*7);
    ctx.stroke();
  }
}

function renderExplore(){
  const f = G.floor, p = G.player;
  ensureFloorMeta(f);
  ctx.fillStyle = '#050409'; ctx.fillRect(0,0,canvas.width,canvas.height);

  // advance the tile-slide: rx/ry are where the player is *drawn*, easing from the
  // tile just left toward the tile just entered. The whole view follows this, so
  // the world scrolls a step rather than jumping — that is the headache cure.
  const s = G.slide;
  if (s){
    const k = (G.time - s.start) / s.dur;
    if (k >= 1){ p.rx = s.toX; p.ry = s.toY; G.slide = null; G.moving = false; }
    else { const e = slideEase(k); p.rx = s.fromX + (s.toX - s.fromX)*e; p.ry = s.fromY + (s.toY - s.fromY)*e; }
  } else { p.rx = p.x; p.ry = p.y; }

  // a fractional camera keyed to the drawn position; the integer part indexes
  // tiles, the fraction becomes a sub-pixel scroll. Rounding every screen point
  // against the same origin keeps the pixel art seam-free and crisp.
  const camFx = U.clamp(p.rx - (VW>>1), 0, Math.max(0, f.w - VW));
  const camFy = U.clamp(p.ry - (VH>>1), 0, Math.max(0, f.h - VH));
  const camX = Math.floor(camFx), camY = Math.floor(camFy);
  const originX = camFx * TS, originY = camFy * TS;
  const SX = w => Math.round(w*TS - originX);
  const SY = h => Math.round(h*TS - originY);
  const sanc = f._sanctum;

  // tiles — one extra row/column so the partial edge tiles fill the scroll gap
  for (let vy = 0; vy <= VH; vy++){
    for (let vx = 0; vx <= VW; vx++){
      const x = camX+vx, y = camY+vy; if (!f.inb(x,y)) continue;
      const i = f.idx(x,y); const sx = SX(x), sy = SY(y);
      if (!f.explored[i]) continue;
      drawTile(f.tileAt(x,y), sx, sy, x, y);
      // the sanctum floor takes a warm, consecrated tone
      if (sanc && x>=sanc.x && x<sanc.x+sanc.w && y>=sanc.y && y<sanc.y+sanc.h && f.tileAt(x,y)!==TILE.WALL){
        ctx.fillStyle = 'rgba(150,120,70,0.12)'; ctx.fillRect(sx, sy, TS, TS);
      }
    }
  }
  // the fret border framing the sanctum (fog paints over the unexplored parts after)
  drawSanctumFret(f, SX, SY);
  // ritual circle drawn onto the sanctum floor, under everything else
  for (const e of f.entities){
    if (!(e.type === 'prop' && e.ritual)) continue;
    const i = f.idx(e.x, e.y); if (!f.explored[i]) continue;
    drawRitual(SX(e.x)+8, SY(e.y)+8, f.visible[i]);
  }
  // static entities (remembered) + dynamic (visible only)
  for (const e of f.entities){
    const i = f.idx(e.x, e.y);
    const vis = f.visible[i], seen = f.explored[i];
    const sx = SX(e.x), sy = SY(e.y);
    if (sx < -TS || sy < -TS || sx > canvas.width || sy > canvas.height) continue;
    if (e.type === 'enemy'){ if (!vis) continue; Sprites.draw(ctx, Data.ENEMIES[e.enemyId].sprite, sx+2, sy+2, 1);
      if (e.elite){ ctx.fillStyle='#d0a84e'; ctx.fillRect(sx+5,sy,1,2); ctx.fillRect(sx+7,sy-1,2,3); ctx.fillRect(sx+10,sy,1,2); } }
    else if (e.type === 'guardian'){ if (!seen) continue; Sprites.draw(ctx, Data.ENEMIES[e.enemyId].sprite, sx+2, sy+2, 1);
      const gp = 0.6+0.4*Math.sin(G.time/250);
      ctx.globalAlpha = gp; ctx.fillStyle='#ffcf5a';
      ctx.fillRect(sx+7,sy-2,2,2); ctx.fillRect(sx+6,sy-1,1,1); ctx.fillRect(sx+9,sy-1,1,1);
      ctx.globalAlpha = 1; }
    else if (e.type === 'event'){ if (!seen) continue;
      const ic = Data.EVENT_ICONS[e.eventId] || { g:'!', c:'#c8a24a' };
      drawMarker(sx, sy, ic.g, ic.c); }
    else if (e.type === 'chest'){ if (!seen) continue; Sprites.draw(ctx, 'obj_chest', sx+2, sy+2, 1); }
    else if (e.type === 'npc'){ if (!seen) continue; Sprites.draw(ctx, 'npc_alchemist', sx+2, sy+2, 1);
      // a quest glyph floats over the potion-maker: ? to offer, … while you gather
      if (e.quest && e.quest.stage !== 'done'){
        const g = e.quest.stage === 'active' ? '…' : '?';
        drawMarker(sx, sy-7, g, e.quest.stage === 'active' ? '#7fae3a' : '#c8a24a'); } }
    else if (e.type === 'plant'){ if (!seen) continue;
      const bob = Math.sin(G.time/260 + e.x*2) > 0.4 ? 1 : 0;
      Sprites.draw(ctx, 'obj_herb', sx+2, sy+2 - bob, 1); }
    else if (e.type === 'stairs'){ if (!seen) continue; Sprites.draw(ctx, 'obj_stairs', sx+2, sy+2, 1); }
    else if (e.type === 'prop'){ if (!seen) continue; Sprites.draw(ctx, e.sprite, sx+2, sy+2, 1); }
    else if (e.type === 'torch'){ if (!vis) continue; const fl = Math.sin(G.time/120 + e.x)*0.5+0.5; Sprites.draw(ctx, 'obj_torch', sx+2, sy+2 - (fl>0.6?1:0), 1); }
  }
  // player — while a slide runs, a couple of fading afterimages trail behind the
  // step, the "motion blur" that reads the movement without smearing the pixels
  if (s && G.slide){
    const dx = s.toX - s.fromX, dy = s.toY - s.fromY;
    const k = U.clamp((G.time - s.start) / s.dur, 0, 1);
    const fade = 1 - k;                                   // trail thins as the step arrives
    for (const [back, a] of [[0.34, 0.22], [0.62, 0.11]]){
      const t = Math.max(0, slideEase(k) - back);
      ctx.globalAlpha = a * fade;
      Sprites.draw(ctx, p.sprite, SX(s.fromX + dx*t)+2, SY(s.fromY + dy*t)+2, 1);
    }
    ctx.globalAlpha = 1;
  }
  Sprites.draw(ctx, p.sprite, SX(p.rx)+2, SY(p.ry)+2, 1);

  // fog: darken explored-not-visible
  for (let vy = 0; vy <= VH; vy++){
    for (let vx = 0; vx <= VW; vx++){
      const x = camX+vx, y = camY+vy; if (!f.inb(x,y)) continue;
      const i = f.idx(x,y); const sx=SX(x), sy=SY(y);
      if (!f.explored[i]){ ctx.fillStyle = '#050409'; ctx.fillRect(sx,sy,TS,TS); }
      else if (!f.visible[i]){ ctx.fillStyle = 'rgba(5,4,10,0.6)'; ctx.fillRect(sx,sy,TS,TS); }
    }
  }
  // torch + player light (colors follow the biome)
  const pal = curBiome().pal;
  ctx.globalCompositeOperation = 'lighter';
  radial(SX(p.rx)+8, SY(p.ry)+8, 70, `rgba(${pal.ambient},0.30)`);
  for (const e of f.entities){ if (e.type==='torch' && f.visible[f.idx(e.x,e.y)]){
    const fl = Math.sin(G.time/120 + e.x)*0.2+0.8;
    radial(SX(e.x)+8, SY(e.y)+8, 46, `rgba(${pal.torch},${0.28*fl})`); } }
  // the sanctum's shard casts its own cold arcane glow
  for (const e of f.entities){ if (e.type==='prop' && e.ritual && f.visible[f.idx(e.x,e.y)]){
    const fl = Math.sin(G.time/300)*0.15+0.85;
    radial(SX(e.x)+8, SY(e.y)+8, 52, `rgba(154,92,192,${0.22*fl})`); } }
  // a quest herb glows faintly so a needed sprig can be spotted across a lit room
  for (const e of f.entities){ if (e.type==='plant' && f.visible[f.idx(e.x,e.y)]){
    const fl = Math.sin(G.time/220 + e.x)*0.2+0.8;
    radial(SX(e.x)+8, SY(e.y)+8, 26, `rgba(120,200,120,${0.26*fl})`); } }
  ctx.globalCompositeOperation = 'source-over';
  vignette();
}

function drawMarker(sx, sy, chr, color){
  // a dark disc so the glyph reads against any floor, then the sign itself
  ctx.fillStyle = 'rgba(8,6,14,0.85)';
  ctx.beginPath(); ctx.arc(sx+8, sy+8, 7, 0, 7); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx+8, sy+8, 7, 0, 7); ctx.stroke();
  ctx.fillStyle = color; ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(chr, sx+8, sy+9);
}
// a ritual sigil on the sanctum floor: two rings and a slowly turning rune band
function drawRitual(cx, cy, bright){
  const a = bright ? 0.8 : 0.35;
  ctx.strokeStyle = `rgba(154,92,192,${a})`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 21, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 7); ctx.stroke();
  ctx.strokeStyle = `rgba(208,168,78,${a})`;
  for (let i = 0; i < 8; i++){
    const ang = i/8 * Math.PI*2 + G.time/2600;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(ang)*21, cy + Math.sin(ang)*21);
    ctx.lineTo(cx + Math.cos(ang)*25, cy + Math.sin(ang)*25);
    ctx.stroke();
  }
}
function radial(cx, cy, r, color){
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
}
function vignette(){
  const g = ctx.createRadialGradient(canvas.width/2,canvas.height/2,60,canvas.width/2,canvas.height/2,200);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
}

function renderCombat(){
  const en = G.combat.enemy, p = G.player;
  // backdrop
  const grd = ctx.createLinearGradient(0,0,0,canvas.height);
  grd.addColorStop(0,'#140d1e'); grd.addColorStop(1,'#080610');
  ctx.fillStyle = grd; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#0d0a16'; ctx.fillRect(0, canvas.height-46, canvas.width, 46);
  ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0, canvas.height-46, canvas.width, 2);
  // pillars
  for (const px of [30, canvas.width-42]){ ctx.fillStyle='#1a1428'; ctx.fillRect(px,20,12,canvas.height-60); ctx.fillStyle='#241c34'; ctx.fillRect(px,20,12,4); }
  // light
  ctx.globalCompositeOperation='lighter';
  radial(canvas.width*0.62, 74, 90, 'rgba(150,60,120,0.10)');
  ctx.globalCompositeOperation='source-over';

  // enemy sprite (right/upper) — bosses, guardians and elites loom larger.
  // its name / HP / limbs / statuses are drawn crisply in the DOM enemy panel.
  const es = (en.boss || en.elite || en.guardian) ? 7 : 6;
  const ex = Math.round(canvas.width*0.60), ey = 34;
  Sprites.draw(ctx, en.sprite, ex, ey, es);

  // player sprite (left/lower)
  Sprites.draw(ctx, p.sprite, 40, canvas.height-84, 5);
  drawStatusIcons(p, 40, canvas.height-20);
  if (p.shield>0){ ctx.fillStyle='#8ab0e0'; ctx.font='8px monospace'; ctx.fillText(`⛊${p.shield}`, 92, canvas.height-70); }

  vignette();
}
function bar(x,y,w,h,frac,c1,c2){
  ctx.fillStyle='#000'; ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle='#1a1526'; ctx.fillRect(x,y,w,h);
  const g=ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; ctx.fillRect(x,y,Math.max(0,Math.round(w*U.clamp(frac,0,1))),h);
}
function drawStatusIcons(c, x, y){
  const s=[]; if(c.statuses.poison)s.push(['☠','#7fae3a']); if(c.statuses.weaken)s.push(['▼','#a85cc8']);
  if(c.statuses.regen)s.push(['+','#6fbf6a']); if(c.statuses.atkbuff)s.push(['▲','#d0a84e']); if(c.statuses.stun)s.push(['✦','#e0e0f0']);
  if(c.statuses.charmed)s.push(['♥','#d59cf0']); if(c.statuses.charmGain)s.push(['♥','#d59cf0']);
  ctx.font='8px monospace'; ctx.textAlign='left';
  s.forEach((it,i)=>{ ctx.fillStyle=it[1]; ctx.fillText(it[0], x+i*10, y); });
}

function updateHUD(){
  const p = G.player; if (!p) return;
  U.el('hud-name').textContent = p.name + ' · Lv ' + (p.level || 1);
  setBar('hp', p.hp, p.maxhp); setBar('sp', p.sp, p.maxsp);
  setBar('fd', Math.round(p.food), FOOD_MAX);
  const fdBar = U.el('fd-fill').parentElement;
  fdBar.classList.toggle('low', hungerStage(p) >= 2);
  const tier = Data.honorTier(p.honor);
  U.el('honor-mark').style.left = ((p.honor+100)/200*100) + '%';
  const ht = U.el('honor-txt'); ht.textContent = p.honor; ht.style.color = tier.color;
  U.el('honor-mark').style.background = tier.color;
  U.el('gold-txt').textContent = p.gold;
  U.el('souls-txt').textContent = Save.souls();
  U.el('depth-txt').textContent = G.depth + (G.biome ? ' · ' + curBiome().name.replace(/^The /, '').toUpperCase() : '');

  // alignment badge + transition announcements
  const a = alignment(p.honor), badge = U.el('align-badge');
  if (a === 'MARKED'){ badge.textContent = 'MARKED'; badge.className = 'align-badge marked'; }
  else if (a === 'HALLOWED'){ badge.textContent = 'HALLOWED'; badge.className = 'align-badge hallowed'; }
  else { badge.textContent = ''; badge.className = 'align-badge'; }
  if (p._align !== a){
    if (p._align !== undefined){
      if (a === 'MARKED') log('You are MARKED. The Gilded Inquisition hunts the dishonored — but the spoils of sin run rich.', 'bad');
      else if (a === 'HALLOWED') log('You are HALLOWED. The dark stays its hand and the kind draw near — though fortune turns modest.', 'good');
      else if (p._align === 'MARKED') log('The Inquisition loses your scent. You are no longer Marked.', 'hi');
      else if (p._align === 'HALLOWED') log("The light's special favor fades. You are no longer Hallowed.", 'hi');
    }
    p._align = a;
  }

  // bounty / heat meter — visible while Marked or while heat lingers
  const heat = p.heat || 0, bounty = U.el('bounty');
  if (a === 'MARKED' || heat > 0){
    const tier = heatTier(heat);
    bounty.className = 'bounty t' + tier;
    U.el('bounty-fill').style.width = heat + '%';
    U.el('bounty-tier').textContent = HEAT_TIER_NAMES[tier];
  } else {
    bounty.className = 'bounty hidden';
  }
  // the one walking behind you
  const strip = U.el('follower-strip');
  if (strip){
    if (p.follower){
      const fo = p.follower, fh = followerHunger(fo);
      strip.classList.remove('hidden');
      U.el('fo-name').textContent = fo.name;
      U.el('fo-stats').innerHTML =
        `<span class="${fo.hp < fo.maxhp*0.35 ? 'hurt' : ''}">HP ${fo.hp}/${fo.maxhp}</span> · ` +
        `SP ${fo.sp}/${fo.maxsp} · ` +
        `<span class="${fh>=2 ? 'starve' : ''}">FOOD ${Math.round(fo.food)}</span>`;
    } else {
      strip.classList.add('hidden');
    }
  }
  updateEnemyPanel();
}
function setBar(kind, cur, max){
  U.el(kind+'-fill').style.width = U.clamp(cur/max*100,0,100)+'%';
  U.el(kind+'-txt').textContent = `${Math.max(0,Math.round(cur))}/${max}`;
}
function log(text, cls){
  const box = U.el('log');
  const line = U.make('div', 'line'+(cls?' '+cls:''), text);
  box.appendChild(line);
  while (box.children.length > 80) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function floatOn(isPlayer, text, color){
  const fx = U.el('fx');
  const d = U.make('div', 'float', text); d.style.color = color;
  let xf, yf;
  if (G.state === 'COMBAT'){ xf = isPlayer ? 0.22 : 0.66; yf = isPlayer ? 0.62 : 0.28; }
  else { xf = 0.5; yf = 0.5; }
  d.style.left = (xf*100)+'%'; d.style.top = (yf*100)+'%';
  fx.appendChild(d); setTimeout(()=>d.remove(), 1000);
}

// the Alchemist's combat panel: pick a target, then hurl or pour a brew
function renderAlchemistCombat(box, p, myTurn){
  if (!G.combat.potTarget) G.combat.potTarget = 'enemy';
  const hasFollower = followerAlive();
  if (G.combat.potTarget === 'follower' && !hasFollower) G.combat.potTarget = 'enemy';
  // target row
  const row = U.make('div','target-row');
  const mk = (key, label) => {
    const t = U.make('button','tbtn' + (G.combat.potTarget===key?' sel':''));
    t.textContent = label;
    t.onclick = () => { G.combat.potTarget = key; renderActions(); };
    return t;
  };
  row.appendChild(mk('enemy', 'At the foe'));
  row.appendChild(mk('self', 'On yourself'));
  if (hasFollower) row.appendChild(mk('follower', 'On ' + p.follower.name.split(' ')[0]));
  box.appendChild(row);
  box.appendChild(U.make('div','line dim', 'Brew potions at the bench (Menu → Inventory). Throw the harmful ones at the foe; pour the good ones on yourself or your follower.'));

  const kept = p.inv.filter(x => Data.POTIONS[x]);
  const counts = {}; for (const id of kept) counts[id] = (counts[id]||0) + 1;
  const order = Object.keys(counts).sort((a,b)=> ['offense','debuff','buff','food'].indexOf(Data.POTIONS[a].cat) - ['offense','debuff','buff','food'].indexOf(Data.POTIONS[b].cat));
  for (const id of order){
    const po = Data.POTIONS[id], good = po.cat === 'buff' || po.cat === 'food';
    const b = Btn('', ()=>applyPotion(id, G.combat.potTarget), 'btn'+(good?' good':''));
    b.innerHTML = `<span>${po.verb[0].toUpperCase()+po.verb.slice(1)} ${po.name} ×${counts[id]}</span>` +
      `<span class="cost" style="color:${POT_CAT_COLOR[po.cat]}">${po.cat}</span><span class="sub">${po.desc}</span>`;
    b.disabled = !myTurn;
    box.appendChild(b);
  }
  // always available, so an empty pack is never a dead end
  const sp = Btn('', improvisedSplash, 'btn');
  sp.innerHTML = `<span class="k">✷</span>Improvised Splash<span class="sub">A weak throw of raw reagents at the foe — for when the bottles run dry.</span>`;
  sp.disabled = !myTurn;
  box.appendChild(sp);
}

function renderActions(){
  const box = U.el('actions'); box.innerHTML = '';
  const tc = U.el('touch-controls');
  if (tc) tc.classList.toggle('combat', G.state === 'COMBAT');
  if (G.state === 'EXPLORE'){
    // nothing here: everything lives behind the ☰ Menu on the stage, so the
    // log gets the whole dock and the D-pad sits at the bottom of the screen
  } else if (G.state === 'COMBAT' && G.combat){
    const p = G.player, myTurn = G.combat.turn === 'player' && !G.busy;
    // the Alchemist fights entirely through potions — her own panel replaces
    // limb-aiming and the skill list
    if (usesInt(p)){
      renderAlchemistCombat(box, p, myTurn);
    } else {
    // ---- aim row: physical attacks strike the chosen part ----
    const en = G.combat.enemy;
    if (en.parts){
      const row = U.make('div','target-row');
      const mkT = (key, label, subHTML) => {
        const t = U.make('button','tbtn' + (G.combat.target===key?' sel':'') + (key!=='body'&&en.parts[key].cut?' cut':''));
        t.innerHTML = label + (subHTML?`<span class="lhp">${subHTML}</span>`:'');
        const severed = key!=='body' && en.parts[key].cut;
        t.disabled = severed;
        t.onclick = () => { if (!severed){ G.combat.target = key; renderActions(); } };
        return t;
      };
      row.appendChild(mkT('body','BODY','full harm'));
      for (const key of ['arms','legs','head']){
        const part = en.parts[key];
        row.appendChild(mkT(key, part.name, part.cut ? '✂ severed' : (key==='head'?`${part.hp} · may miss`:`${part.hp}`)));
      }
      box.appendChild(row);
      if (G.combat.target !== 'body')
        box.appendChild(U.make('div','line dim','Aimed blows harm the limb; some damage bleeds through. Severed limbs stay severed.'));
    }
    p.skills.forEach((id, idx) => {
      const sk = Data.SKILLS[id];
      const b = Btn('', ()=>doPlayer(id), 'btn '+(sk.type==='defend'||sk.type==='heal'||sk.type==='buff'?'good':''), String(idx+1));
      const lv = skillLevel(p, id), mine = skillOwned(p, id);
      const pips = '◆'.repeat(lv) + '◇'.repeat(3-lv);
      b.innerHTML = `<span class="k">${idx+1}</span>${sk.name} <span style="font-size:10px;color:${mine?'#c8a24a':'#c05070'}">${pips}${mine?'':' borrowed'}</span>` +
        `${sk.cost?`<span class="cost">${sk.cost} SP</span>`:''}<span class="sub">${sk.desc}</span>`;
      b.disabled = !myTurn || sk.cost > p.sp;
      box.appendChild(b);
    });
    }   // end non-Alchemist limb-aim + skill list
    // relic powers — once per battle
    for (const slot of ['weapon','armor','trinket']){
      const id = p.equip[slot]; if (!id) continue;
      const it = Data.ITEMS[id]; if (!it.active) continue;
      const used = !!G.usedActives[id];
      const b = Btn('', ()=>doActive(id), 'btn');
      b.innerHTML = `<span class="k">◆</span>${it.active.name}<span class="cost">${used?'spent':'1/battle'}</span><span class="sub">${it.active.desc}</span>`;
      b.disabled = !myTurn || used;
      box.appendChild(b);
    }
    // the pocketed coin — call on the Nameless god, once per battle
    if (p.pocketCoin && !G.usedActives.coin_war){
      const b = Btn('', doCoinFlip, 'btn danger');
      b.innerHTML = `<span class="k">◎</span>Flip the Nameless Coin<span class="cost">1/battle</span><span class="sub">Heads: it takes from them. Tails: it takes from you. The god is amused either way.</span>`;
      b.disabled = !myTurn;
      box.appendChild(b);
    }
    const potions = p.inv.filter(x=>x==='potion_heal').length;
    if (potions){ const b = Btn(`Draught of Mending ×${potions}`, ()=>usePotion('potion_heal'), 'btn good'); b.disabled=!myTurn; box.appendChild(b); }
    const focuses = p.inv.filter(x=>x==='potion_focus').length;
    if (focuses){ const b = Btn(`Draught of Focus ×${focuses} (+5 SP)`, ()=>usePotion('potion_focus'), 'btn'); b.disabled=!myTurn || p.sp>=p.maxsp; box.appendChild(b); }
    // no skill you can pay for — offer an explicit way to yield the turn so SP ticks
    // back (the Alchemist never needs this: Improvised Splash is always available)
    if (!usesInt(p) && !hasAffordableSkill(p)){
      const b = Btn('', passTurn, 'btn danger');
      b.innerHTML = `<span class="k">⏳</span>Catch your breath<span class="sub">No focus left for any skill — yield the turn and recover SP.</span>`;
      b.disabled = !myTurn;
      box.appendChild(b);
    }
    if (hungerStage(p) >= 1){
      const breads = p.inv.filter(x=>x==='ration').length;
      const meats = p.inv.filter(x=>x==='strange_meat').length;
      if (breads){ const b = Btn(`Eat Grave-Bread ×${breads} (+35 FOOD)`, ()=>eatFood('ration'), 'btn good'); b.disabled=!myTurn; box.appendChild(b); }
      if (meats){ const b = Btn(`Eat Strange Meat ×${meats} (+60 FOOD…)`, ()=>eatFood('strange_meat'), 'btn danger'); b.disabled=!myTurn; box.appendChild(b); }
    }
    // Flee lives on the stage (top-right) so it's always in reach without scrolling
  }
  updateEnemyPanel();
  updateStageBtn();
}

function Btn(label, fn, cls, key){
  const b = U.make('button', cls||'btn');
  if (label) b.innerHTML = (key?`<span class="k">${key}</span>`:'') + label;
  b.onclick = fn;
  return b;
}

// ---- Spend the twenty before the stair ----
function showAllotment(){
  G.state = 'ALLOT';
  const c = Data.CLASSES[G.selClass];
  const allowed = allotAllowed(G.selClass);
  // whoever we came from may have spent points; the Witch must not inherit them
  if (!allowed) G.allot = blankAllotment();
  G.allot = G.allot || blankAllotment();
  const a = G.allot;
  const left = ALLOT_POINTS - allotSpent(a);

  const s = U.make('div','sheet');
  s.appendChild(U.make('div','sect','What You Were Before'));
  s.appendChild(U.make('div','p dim', allowed
    ? 'Twenty points of whoever you used to be, and the dark gets everything after that. No more than ten into any one of them.'
    : 'Nothing. There is no before — she traded it, and the terms were not favourable.'));

  const head = U.make('div','card sel');
  const cv = U.make('canvas'); cv.width=52; cv.height=52; head.appendChild(cv); Sprites.toCanvas(cv, c.sprite, 4);
  const info = U.make('div');
  info.appendChild(U.make('h3', null, c.name));
  info.appendChild(U.make('div','role', c.role));
  const b = c.base;
  info.appendChild(U.make('div','stats', ALLOT_STATS.map(st => {
    const add = (a[st.key]||0) * st.amt;
    const bv  = st.key === 'hp' ? b.hp : st.key === 'sp' ? b.sp : b[st.key];
    return `<b>${st.label}</b> ${bv}${add ? ` <span style="color:#6fbf6a">+${add}</span>` : ''}`;
  }).join(' · ')));
  head.appendChild(info);
  s.appendChild(head);

  // the Necromancer chooses a discipline for the whole descent, here and now
  if (G.selClass === 'necromancer'){
    s.appendChild(U.make('div','sect','The Cursed Path'));
    s.appendChild(U.make('div','p dim','Pick the discipline you will follow this whole descent. You will only be able to learn spells of the path you choose.'));
    const prow = U.make('div','target-row');
    for (const [key, label, sub] of [['offense','⚔ Offensive','bone, poison, curses that kill'],['defense','⛨ Defensive','bone armor, the golem, curses that unstring']]){
      const on = G.necroStyle === key;
      const t = U.make('button','tbtn'+(on?' sel':''));
      t.innerHTML = `${label}<span class="lhp">${sub}</span>`;
      t.onclick = () => { G.necroStyle = key; showAllotment(); };
      prow.appendChild(t);
    }
    s.appendChild(prow);
  }

  // the Witch skips the whole ledger — her passive does this work in the dark
  if (!allowed){
    const pv = (Data.PASSIVES[G.selClass] || [])[0];
    s.appendChild(U.make('div','p',
      'The others walk in already shaped. She walks in owing, and takes the difference out of whatever she kills.'));
    if (pv) s.appendChild(U.make('div','p',
      `<span style="color:#9a5cc0">◈ ${pv.name}</span> — <span style="color:#8a7f9e">${pv.desc}</span>`));
    s.appendChild(U.make('div','p dim','<i>No points to spend. Every fight you win gives her one instead — and she chooses no better than the dark does.</i>'));
    const row0 = U.make('div','row');
    row0.appendChild(Btn('Descend', startRun, 'btn center'));
    row0.appendChild(Btn('Back', showCharSelect, 'btn center'));
    s.appendChild(row0);
    setModal(s);
    return;
  }

  s.appendChild(U.make('div','balance',
    `<span class="${left ? 'g' : 's'}">${left} point${left===1?'':'s'} left of twenty</span>`));

  for (const st of ALLOT_STATS){
    const n = a[st.key] || 0;
    const line = U.make('div','allot-row');
    line.appendChild(U.make('span','allot-name',
      `<b>${st.label}</b> <span class="dim">+${st.amt} each</span>`));
    const minus = Btn('−', ()=>{ a[st.key] = Math.max(0, n-1); showAllotment(); }, 'btn allot-btn');
    minus.disabled = n <= 0;
    const val = U.make('span','allot-val', `${n}${n ? ` <span class="dim">(+${n*st.amt})</span>` : ''}`);
    const plus = Btn('+', ()=>{ a[st.key] = Math.min(ALLOT_CAP, n+1); showAllotment(); }, 'btn allot-btn');
    plus.disabled = n >= ALLOT_CAP || left <= 0;
    line.appendChild(minus); line.appendChild(val); line.appendChild(plus);
    s.appendChild(line);
  }

  const row = U.make('div','row');
  const needStyle = G.selClass === 'necromancer' && !G.necroStyle;
  const go = Btn(needStyle ? 'Choose a path first' : 'Descend', startRun, 'btn center');
  go.disabled = left > 0 || needStyle;
  if (left > 0) row.appendChild(Btn('Spread them evenly', ()=>{
    const each = Math.floor(ALLOT_POINTS / ALLOT_STATS.length);
    let rest = ALLOT_POINTS - each * ALLOT_STATS.length;
    for (const st of ALLOT_STATS){ a[st.key] = each + (rest-- > 0 ? 1 : 0); }
    showAllotment();
  }, 'btn center'));
  if (allotSpent(a) > 0) row.appendChild(Btn('Clear', ()=>{ G.allot = blankAllotment(); showAllotment(); }, 'btn center'));
  row.appendChild(go);
  row.appendChild(Btn('Back', showCharSelect, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

  'wellspring_stave','widowmaker','gluttons_girdle','reapers_tithe','pilgrims_mercy','dread_aegis','ruin_brand'];

function goldPrice(base){ const favor = Save.sanctumLevel('favor'); return Math.max(1, Math.round(base * (1 - 0.1*favor))); }
function gearPriceGold(id){ const it=Data.ITEMS[id]; return goldPrice(14 + statSum(it.mods)*5 + (it.flag?20:0)); }
function relicPriceSouls(id){ const it=Data.ITEMS[id]; return Math.round(20 + statSum(it.mods)*3 + (it.flag?12:0)); }
function modStr(m){ m=m||{}; const parts=[]; for (const k of ['atk','def','mag','spd','hp','sp']){ if (m[k]) parts.push(`${m[k]>0?'+':''}${m[k]} ${k.toUpperCase()}`); } return parts.join(' · ') || 'trinket'; }

function forceEquip(id){
  const p=G.player, it=Data.ITEMS[id], slot=it.slot, cur=p.equip[slot];

function rollShopStock(nextDepth){
  const tier=U.clamp(Math.ceil(nextDepth/2),1,3);
  const gearIds=U.shuffle(Data.ITEM_POOL[tier].slice());

  for (let i=0;i<2 && i<gearIds.length;i++){ const id=gearIds[i]; gear.push({ id, price:gearPriceGold(id), sold:false }); }
  const rids=U.shuffle(SHOP_RELICS.slice());
  const relics=[ { kind:'vigor', price:26, sold:false }, { kind:'item', id:rids[0], price:relicPriceSouls(rids[0]), sold:false } ];
  return { gear, relics, absDone:false, nextDepth };
}

// ---- Suspending a descent: the whole floor, fog and all, put down and taken up again ----
const RUN_KEY = 'graveborne_run_v1';
function serializeRun(){
  const f = G.floor;
  return {
    v:1, ts:Date.now(), depth:G.depth, biome:G.biome, floorFov:G.floorFov || 0,
    player:G.player,
    floor: f ? { w:f.w, h:f.h, depth:f.depth, isFinal:f.isFinal, tiles:f.tiles, rooms:f.rooms,
                 visible:f.visible, explored:f.explored, entities:f.entities,
                 playerStart:f.playerStart, guardianSlain:!!f.guardianSlain, captainCame:!!f.captainCame } : null,
  };
}
// a saved floor is plain data — give it its behaviour back
function rehydrateFloor(d){
  const idx = (x,y) => y * d.w + x;
  const inb = (x,y) => x >= 0 && y >= 0 && x < d.w && y < d.h;
  return Object.assign({}, d, {
    idx, inb,
    tileAt(x,y){ return inb(x,y) ? this.tiles[idx(x,y)] : TILE.WALL; },
    isWalkable(x,y){ return this.tileAt(x,y) !== TILE.WALL; },
    entityAt(x,y){ return this.entities.find(e => e.x===x && e.y===y && !e.dead); },
    removeEntity(e){ const i = this.entities.indexOf(e); if (i >= 0) this.entities.splice(i,1); },
  });
}
function hasSavedRun(){ try { return !!localStorage.getItem(RUN_KEY); } catch(e){ return false; } }
function savedRunInfo(){
  try { const d = JSON.parse(localStorage.getItem(RUN_KEY));
    return d ? { name:(d.player&&d.player.name)||'—', depth:d.depth, lv:(d.player&&d.player.level)||1, ts:d.ts } : null;
  } catch(e){ return null; }
}
function clearSavedRun(){ try { localStorage.removeItem(RUN_KEY); } catch(e){} }
function saveRun(){
  if (!G.player || G.state !== 'EXPLORE') return false;
  try { localStorage.setItem(RUN_KEY, JSON.stringify(serializeRun())); return true; }
  catch(e){ return false; }
}
function loadRun(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(RUN_KEY)); } catch(e){}
  if (!d || !d.player || !d.floor) return false;
  G.player = d.player; G.depth = d.depth; G.biome = d.biome; G.floorFov = d.floorFov || 0;
  G.floor = rehydrateFloor(d.floor);
  G.combat = null; G.busy = false; G.moving = false; G.state = 'EXPLORE';
  G.pendingEvent = null; G.usedActives = {}; G.shop = null;
  recomputeStats(G.player);
  hideModal();
  U.el('log').innerHTML = '';
  log(`You take up the thread where you left it — Depth ${G.depth}.`, 'hi');
  revealFOV(); updateHUD(); renderActions();
  return true;
}

// ---- Inspecting gear: never buy blind ----
function itemRarity(it){
  return it.rarity || (it.active ? 'legendary' : (it.tier >= 3 ? 'rare' : 'common'));
}
function rarityTag(it){
  const r = Data.RARITY[itemRarity(it)] || Data.RARITY.common;
  return `<span style="color:${r.color}">${r.name}</span>`;
}
const STAT_KEYS = [['atk','ATK'],['def','DEF'],['mag','MAG'],['spd','SPD'],['hp','HP'],['sp','SP']];
function passiveText(pa){
  if (!pa) return '';
  const bits = [];
  if (pa.lifesteal)  bits.push(`blows drink ${Math.round(pa.lifesteal*100)}%`);
  if (pa.crit)       bits.push(`+${Math.round(pa.crit*100)}% crit chance`);
  if (pa.dmg && pa.dmg !== 1) bits.push(`+${Math.round((pa.dmg-1)*100)}% damage`);
  if (pa.regen)      bits.push(`mends ${pa.regen} HP per step`);
  if (pa.spRegen)    bits.push(`+${pa.spRegen} SP every step out of combat`);
  if (pa.foodMult && pa.foodMult !== 1) bits.push(pa.foodMult < 1
    ? `hunger ${Math.round((1-pa.foodMult)*100)}% slower`
    : `hunger ${Math.round((pa.foodMult-1)*100)}% faster`);
  if (pa.soulMult && pa.soulMult !== 1) bits.push(`+${Math.round((pa.soulMult-1)*100)}% Souls`);
  if (pa.openShield) bits.push(`opens fights shielded (DEF×${pa.openShield})`);
  if (pa.honorMul && pa.honorMul !== 1) bits.push(`honor gains ×${pa.honorMul}`);
  return bits.join(' · ');
}
// a full breakdown of an item beside whatever is already in that slot
function showItemCompare(id, priceHTML, canBuy, onBuy, back){
  const p = G.player, it = Data.ITEMS[id];
  const curId = p.equip[it.slot], cur = curId ? Data.ITEMS[curId] : null;
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','sect', `${it.name} — ${it.slot}`));
  s.appendChild(U.make('div','p', `${rarityTag(it)}${priceHTML ? ' · ' + priceHTML : ''}`));
  s.appendChild(U.make('div','p dim', it.desc));

  // stat table: the candidate, what you wear, and the difference
  const rows = STAT_KEYS.map(([k,label]) => {
    const a = (it.mods && it.mods[k]) || 0;
    const b = (cur && cur.mods && cur.mods[k]) || 0;
    if (!a && !b) return '';
    const d = a - b;
    const col = d > 0 ? '#63b7a6' : d < 0 ? '#c05070' : '#8a7f9e';
    const sign = d > 0 ? '+' : '';
    return `<tr><td style="color:#8ea6d8">${label}</td><td style="text-align:right">${a || '—'}</td>` +
           `<td style="text-align:right;color:#8a7f9e">${cur ? (b || '—') : '—'}</td>` +
           `<td style="text-align:right;color:${col}">${d ? sign + d : '·'}</td></tr>`;
  }).filter(Boolean).join('');
  s.appendChild(U.make('div','p',
    `<table style="width:100%;font-size:12px;border-collapse:collapse">` +
    `<tr style="color:#c8a24a"><td>Stat</td><td style="text-align:right">This</td>` +
    `<td style="text-align:right">Worn</td><td style="text-align:right">Change</td></tr>${rows}</table>`));

  const pa = passiveText(it.passive || it.flag);
  if (pa) s.appendChild(U.make('div','p', `<b style="color:#d0a84e">Passive</b> — ${pa}`));
  if (it.active) s.appendChild(U.make('div','p', `<b style="color:#c05070">${it.active.name}</b> (once per battle) — ${it.active.desc}`));

  if (it.set && Data.SETS[it.set]){
    const set = Data.SETS[it.set];
    const have = set.pieces.filter(pid => p.equip.weapon===pid || p.equip.armor===pid || p.equip.trinket===pid);
    s.appendChild(U.make('div','p',
      `<b style="color:#63b7a6">${set.name}</b> — ${have.length}/${set.pieces.length} worn<br>` +
      `<span style="color:#8a7f9e">${set.desc}</span><br>` +
      set.pieces.map(pid => `<span style="color:${have.includes(pid)?'#63b7a6':'#4a4060'}">${have.includes(pid)?'✔':'✘'} ${Data.ITEMS[pid].name}</span>`).join(' · ')));
  }

  if (cur){
    const cpa = passiveText(cur.passive || cur.flag);
    s.appendChild(U.make('div','p dim',
      `<b>Currently worn:</b> ${cur.name} — ${modStr(cur.mods)}${cpa ? ' · ' + cpa : ''}`));
  } else {
    s.appendChild(U.make('div','p dim','<i>That slot is empty — anything is an improvement.</i>'));
  }

  const row = U.make('div','row');
  if (onBuy){
    const b = Btn(canBuy ? 'Take it' : 'Cannot afford', ()=>{ onBuy(); }, 'btn center' + (canBuy?' good':''));
    b.disabled = !canBuy;
    row.appendChild(b);
  }
  row.appendChild(Btn('Back', back, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

// ---- The crafting bench: turn gathered herbs into potions, sharpening INT ----
const POT_CAT_COLOR = { offense:'#c05070', debuff:'#9a5cc0', buff:'#63b7a6', food:'#a87e34' };
const INT_PER_BREW = 2;
function recipeUnlocked(p, po){ return playerInt(p) >= (po.intReq || 0); }
function craftPotion(id){
  const p = G.player, po = Data.POTIONS[id];
  if (!po || plantCount(p) < po.plants || !recipeUnlocked(p, po)) return;
  spendPlants(p, po.plants);
  p.inv.push(id);
  p.baseSp += INT_PER_BREW; recomputeStats(p); p.sp = p.maxsp;   // every brew sharpens INT
  log(`You brew a ${po.name}. Your hands remember the work — INT is now ${p.maxsp}.`, 'mag');
  // announce any recipe that just came within reach
  for (const rid in Data.POTIONS){ const r = Data.POTIONS[rid];
    if (r.intReq && p.maxsp - INT_PER_BREW < r.intReq && p.maxsp >= r.intReq)
      log(`Your understanding deepens — you can now brew ${r.name} (INT ${r.intReq}).`, 'good'); }
  updateHUD();
  showCrafting();
}
function showCrafting(){
  const p = G.player;
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','sect','The Crafting Bench'));
  const herbs = Object.keys(p.plants||{}).filter(k=>p.plants[k]>0);
  s.appendChild(U.make('div','p',
    `<b>INT ${p.maxsp}</b> — every potion you brew scales with it. Herbs on hand: <b style="color:#7fae3a">${plantCount(p)}</b>.`));
  s.appendChild(U.make('div','p dim', herbs.length
    ? herbs.map(k=>`<span style="color:${Data.PLANTS[k].color}">${Data.PLANTS[k].glyph}</span> ${Data.PLANTS[k].name} ×${p.plants[k]}`).join(' · ')
    : '<i>No herbs gathered. Walk over the sprigs that glow green on the floor.</i>'));

  s.appendChild(U.make('div','p dim',
    `You know your <b>Bitter Tonic</b> from the start. The rest open as your INT climbs — brewing anything raises INT by ${INT_PER_BREW}, and every potion hits harder the higher your INT.`));
  for (const cat of ['offense','debuff','buff','food']){
    s.appendChild(U.make('div','sect', ({offense:'Offensive — to hurl',debuff:'Debuff — to hurl',buff:'Buff — to pour',food:'Food — to serve'})[cat]));
    // low tiers first
    const ids = Object.keys(Data.POTIONS).filter(id => Data.POTIONS[id].cat === cat)
      .sort((a,b) => (Data.POTIONS[a].intReq||0) - (Data.POTIONS[b].intReq||0));
    for (const id of ids){
      const po = Data.POTIONS[id];
      const unlocked = recipeUnlocked(p, po);
      const can = unlocked && plantCount(p) >= po.plants;
      const b = Btn('', ()=>craftPotion(id), 'btn'+(can?' good':''));
      const have = p.inv.filter(x=>x===id).length;
      const gate = unlocked ? `${po.plants} herbs` : `🔒 INT ${po.intReq}`;
      b.innerHTML = `<span>${po.name}${have?` <span class="dim">(have ${have})</span>`:''}</span>` +
        `<span class="cost">${gate}</span><span class="sub">${po.desc}${unlocked?` — +${INT_PER_BREW} INT`:` — locked until INT ${po.intReq}`}</span>`;
      b.disabled = !can;
      s.appendChild(b);
    }
  }
  const row = U.make('div','row');
  row.appendChild(Btn('Back to Inventory', ()=>{ hideModal(); showInventory(); }, 'btn center'));
  row.appendChild(Btn('Close', hideModal, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

// ---- Using a potion in a fight: hurled at a foe, poured on an ally, or on you ----
function potPower(spec, int){ return Array.isArray(spec) ? Math.round(spec[0] + int * spec[1]) : spec; }
function potionTargetName(tgt){ return tgt === 'enemy' ? (G.combat && G.combat.enemy.name) : tgt === 'follower' ? (G.player.follower && G.player.follower.name) : 'yourself'; }
function applyPotion(id, tgt){
  if (G.busy || G.state !== 'COMBAT' || !G.combat) return;
  const p = G.player, i = p.inv.indexOf(id);
  if (i < 0) return;
  const po = Data.POTIONS[id];
  // resolve the target object
  let T = tgt === 'enemy' ? G.combat.enemy : tgt === 'follower' ? p.follower : p;
  if (!T){ log('There is no one there to catch it.', 'dim'); return; }
  const tIsEnemy = tgt === 'enemy', tIsPlayer = T === p;
  const int = playerInt(p);
  p.inv.splice(i,1);
  G.busy = true; G.combat.turn = 'enemy'; renderActions();

  const nm = po.name, who = potionTargetName(tgt);
  // effect magnitudes grow proportionally with the INT you bring over the recipe's tier
  const effMult = 1 + Math.max(0, int - (po.intReq || 0)) * 0.025;
  if (po.dmg){
    let dmg = potPower(po.dmg, int);
    if (T.shield > 0){ const ab = Math.min(T.shield, dmg); T.shield -= ab; dmg -= ab; if (ab>0) log(`${tIsEnemy?T.name+"'s":'the'} shield absorbs ${ab}.`, 'dim'); }
    T.hp -= Math.max(0, dmg);
    log(`You ${po.verb} a ${nm} at ${who} — ${Math.max(0,dmg)} damage.`, tIsEnemy?'hi':'bad');
    floatOn(!tIsEnemy && tIsPlayer, `-${Math.max(0,dmg)}`, '#c03636');
  }
  if (po.selfHeal){ const v = potPower(po.selfHeal, int); const b = p.hp; p.hp = Math.min(p.maxhp, p.hp + v);
    if (p.hp - b > 0){ log(`The tonic steadies you (+${p.hp-b} HP).`, 'good'); floatOn(true, `+${p.hp-b}`, '#6fbf6a'); } }
  if (po.effect){
    const ef = po.effect;
    if (ef.poison){ if (immuneToRot(T)) log(`${who} shrugs off the rot.`, 'dim'); else { T.statuses.poison = { dmg:Math.max(1,Math.round(ef.poison.dmg*effMult)), turns:ef.poison.turns }; log(`${who} is wracked with rot (${T.statuses.poison.dmg}/turn).`, tIsEnemy?'hi':'bad'); } }
    if (ef.weaken){ T.statuses.weaken = { amt:Math.max(1,Math.round(ef.weaken.amt*effMult)), turns:ef.weaken.turns }; log(`${who} is weakened (−${T.statuses.weaken.amt} ATK).`, tIsEnemy?'hi':'mag'); }
    if (ef.stun && U.chance(ef.stun)){ if (!tIsPlayer){ T.statuses.stun = 1; log(`${who} is stunned!`, 'hi'); } }
  }
  if (po.buff){
    if (po.buff.atkbuff){ const amt = potPower(po.buff.atkbuff, int); T.statuses.atkbuff = { amt, turns:3 }; log(`${who}: +${amt} ATK for 3 turns.`, 'good'); }
    if (po.buff.regen){ const amt = potPower(po.buff.regen, int); T.statuses.regen = { amt, turns:3 }; log(`${who}: regenerating ${amt}/turn.`, 'good'); }
    if (po.buff.shield){ const v = potPower(po.buff.shield, int); T.shield = Math.min(SHIELD_MAX, (T.shield||0) + v); log(`${who}: +${v} shield.`, 'good'); floatOn(tIsPlayer, `+${v}⛊`, '#8ab0e0'); }
  }
  if (po.heal){ const v = potPower(po.heal, int); const before = T.hp; T.hp = Math.min(maxHp(T, tIsPlayer), T.hp + v); log(`${who} mends ${T.hp-before} HP.`, 'good'); floatOn(tIsPlayer, `+${T.hp-before}`, '#6fbf6a'); }
  if (po.food){
    if (tIsEnemy){ log('The enemy has no belly you care to fill.', 'dim'); }
    else if (tgt === 'follower'){ T.food = Math.min(FOLLOWER_FOOD_MAX, T.food + po.food); log(`${who} eats — FOOD restored.`, 'good'); }
    else { const b = Math.round(p.food); p.food = Math.min(FOOD_MAX, p.food + po.food); log(`You drink the ${nm} (+${Math.round(p.food)-b} FOOD).`, 'good'); }
  }
  updateHUD();
  if (G.combat.enemy.hp <= 0){ setTimeout(win, 550); return; }
  setTimeout(beginEnemyTurn, 560);
}
// the Alchemist's fallback when the bottles run dry — a weak improvised splash
function improvisedSplash(){
  if (G.busy || G.state !== 'COMBAT' || !G.combat) return;
  const p = G.player, en = G.combat.enemy;
  G.busy = true; G.combat.turn = 'enemy'; renderActions();
  let dmg = Math.max(1, Math.round(3 + playerInt(p) * 0.2 - en.def * 0.3));
  if (en.shield > 0){ const ab = Math.min(en.shield, dmg); en.shield -= ab; dmg -= ab; }
  en.hp -= Math.max(0, dmg);
  log(`You fling a fistful of reagents — ${Math.max(0,dmg)} damage. It is not much.`, 'hi');
  floatOn(false, `-${Math.max(0,dmg)}`, '#c03636');
  updateHUD();
  if (en.hp <= 0){ setTimeout(win, 550); return; }
  setTimeout(beginEnemyTurn, 560);
}

function showCodex(fromGame){
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','sect', `Codex of Encounters — ${Save.discoveredCount()}/${Data.CODEX.length}`));
  s.appendChild(U.make('div','p dim','The same place wears a different face for a different soul. Discover both by walking two different roads of honor.'));
  const grid = U.make('div','codex-grid');
  for (const c of Data.CODEX){
    const known = Save.isDiscovered(c.id);
    const item = U.make('div','codex-item'+(known?'':' locked'));
    item.appendChild(U.make('h4',null, known ? c.title : '??? — '+({good:'a mercy',bad:'a cruelty',mag:'a mystery'}[c.tag]||'unknown')));
    item.appendChild(U.make('div','d', known ? c.hint : '<i>Undiscovered. '+c.hint+'</i>'));
    grid.appendChild(item);
  }
  s.appendChild(grid);
  const row = U.make('div','row');
  row.appendChild(Btn('Close', ()=>{ if (fromGame){ hideModal(); } else showTitle(); }, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

function confirmAbandon(){
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','sect','Abandon this run?'));
  s.appendChild(U.make('div','p','Your progress this descent will be lost. (Codex discoveries are kept.)'));
  const row = U.make('div','row');
  row.appendChild(Btn('Return to Title', desertRun, 'btn danger'));
  row.appendChild(Btn('Keep Going', ()=>{ hideModal(); }, 'btn center'));
  s.appendChild(row);
  setModal(s);
}

// Walking out does not get a summary screen. It gets the lights turned off and
// one sentence, and then you can go back to the title and think about it.
function desertRun(){
  clearSavedRun();
  G.player=null; G.floor=null; G.combat=null;
  G.busy=false; G.moving=false; G.state='TITLE';
  hideModal();

  const veil = U.make('div','blackout');
  veil.appendChild(U.make('span', null, U.choice(Data.DESERTIONS)));
  const leave = () => { if (veil.parentNode) veil.parentNode.removeChild(veil); showTitle(); };
  veil.onclick = leave;
  document.body.appendChild(veil);
  setTimeout(() => { if (veil.parentNode) leave(); }, 3600);
}

function showGameOver(){
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','title-big','YOU DIED'));
  const tier = Data.honorTier(G.player.honor);
  s.appendChild(U.make('div','p center',`You fell at Depth ${G.depth}, your honor <span style="color:${tier.color}">${tier.name} (${G.player.honor})</span>.`));
  if (G.lastConverted > 0) s.appendChild(U.make('div','p center',`<span style="color:#7fb0d0">◈ ${G.lastConverted} Souls</span> clung to you beyond death. Total: ◈ ${Save.souls()}.`));
  s.appendChild(U.make('div','p center dim',`Codex discovered: ${Save.discoveredCount()}/${Data.CODEX.length}`));
  const row = U.make('div','row');
  row.appendChild(Btn('Rise Again', showCharSelect, 'btn center'));
  row.appendChild(Btn('Sanctum ◈', showSanctum, 'btn center'));
  row.appendChild(Btn('Codex', ()=>showCodex(false), 'btn center'));
  row.appendChild(Btn('Title', showTitle, 'btn center'));
  s.appendChild(row);
  setModal(s);
}
function showVictory(){
  const s = U.make('div','sheet');
  s.appendChild(U.make('div','title-big','VICTORY'));
  const tier = Data.honorTier(G.player.honor);
  s.appendChild(U.make('div','p center','The Gloamlord is unmade. You climb back toward a sun you had almost forgotten.'));
  s.appendChild(U.make('div','p center dim',`Final honor: <span style="color:${tier.color}">${tier.name} (${G.player.honor})</span> · Codex: ${Save.discoveredCount()}/${Data.CODEX.length}`));
  s.appendChild(U.make('div','p center dim','Try a darker — or purer — soul to uncover the encounters you did not see.'));
  const row = U.make('div','row');
  row.appendChild(Btn('New Descent', showCharSelect, 'btn center'));
  row.appendChild(Btn('Sanctum ◈', showSanctum, 'btn center'));
  row.appendChild(Btn('Codex', ()=>showCodex(false), 'btn center'));
  s.appendChild(row);
  setModal(s);
}

// ---- boot ----
init();

</script>
