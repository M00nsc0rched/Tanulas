<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tanulás</title>
  <meta name="description" content="Tananyagok és Claude dokumentumok egy helyen.">
  <meta name="theme-color" content="#4263eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2b3a99" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- iOS / iPadOS: főképernyőre telepített, teljes képernyős web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tanulás">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">

  <!-- Indítóképek: iPhone 15 Pro Max (430×932 @3x) és iPad 5. gen (768×1024 @2x) -->
  <link rel="apple-touch-startup-image" href="splash/iphone-15-pro-max-portrait.png"
        media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/iphone-15-pro-max-landscape.png"
        media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="splash/ipad-portrait.png"
        media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/ipad-landscape.png"
        media="screen and (device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">

  <link rel="stylesheet" href="css/app.css">
  <script>
    // Téma beállítása még az első rajzolás előtt, hogy ne villanjon.
    try {
      var t = JSON.parse(localStorage.getItem('tanulas.theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="statusbar-bg" aria-hidden="true"></div>

  <nav class="nav" aria-label="Menü">
    <div class="nav-brand">
      <svg class="nav-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.4 6.2C9.5 4.9 7 4.5 3.5 5v13c3.4-.5 5.9 0 7.9 1.3zM12.6 6.2C14.5 4.9 17 4.5 20.5 5v13c-3.4-.5-5.9 0-7.9 1.3z" fill="currentColor"/></svg>
      <span>Tanulás</span>
    </div>
    <a class="nav-item" href="#/" data-route="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h4.5v-6h4v6h4.5V9"/></svg>
      <span>Kezdőlap</span>
    </a>
    <a class="nav-item" href="#/claude" data-route="claude">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <span class="nav-label-short">Claude</span><span class="nav-label-long">Claude dokumentumok</span>
    </a>
    <a class="nav-item" href="#/beallitasok" data-route="beallitasok">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Beállítások</span>
    </a>
  </nav>

  <main id="view" class="main" tabindex="-1"></main>

  <dialog id="add-dialog" class="sheet" aria-labelledby="add-title">
    <form id="add-form" novalidate>
      <h2 id="add-title" class="sheet-title">Link hozzáadása</h2>
      <p class="sheet-sub">Claude Artifact vagy más dokumentum linkje. Csak ezen az eszközön tárolódik.</p>
      <label class="field">
        <span class="field-label">Cím</span>
        <input name="title" type="text" maxlength="120" autocomplete="off" enterkeyhint="next" placeholder="pl. Mechanika jegyzet">
      </label>
      <label class="field">
        <span class="field-label">Link</span>
        <span class="field-row">
          <input name="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="https://claude.ai/artifact/…">
          <button type="button" class="btn-text" data-action="paste">Beillesztés</button>
        </span>
      </label>
      <p class="field-error" id="add-error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="btn" data-action="close-dialog">Mégse</button>
        <button type="submit" class="btn btn-primary">Hozzáadás</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
